media:
  input: static/images
  output: /images

content:
  - name: about
    label: About
    type: file
    path: content/_index.md
    fields:
      - name: title
        label: Title
        type: string

      - name: name
        label: Name
        type: string

      - name: subtitle
        label: Subtitle
        type: string

      - name: summary
        label: Quote / Summary
        type: text

      - name: intro
        label: Introduction
        type: text

      - name: headshot
        label: Headshot
        type: image

  - name: research
    label: Research
    type: file
    path: content/research/index.md
    fields:
      - name: title
        label: Page Title
        type: string

      - name: body
        label: Page Content
        type: rich-text

  - name: coursework
    label: Coursework
    type: file
    path: content/coursework/index.md
    fields:
      - name: title
        label: Page Title
        type: string

      - name: body
        label: Page Content
        type: rich-text

  - name: cv
    label: CV
    type: file
    path: content/cv/index.md
    fields:
      - name: title
        label: Page Title
        type: string

      - name: body
        label: Page Content
        type: rich-text

settings:
  content:
    merge: true
