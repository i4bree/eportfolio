# Build and deploy Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Run whenever changes are pushed to main
  push:
    branches:
      - main

  # Allow manual deployment from the Actions tab
  workflow_dispatch:

# Permissions required by GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one Pages deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ========================================================
  # Build
  # ========================================================

  build:
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.165.0

    steps:
      # ----------------------------------------------------
      # Install Hugo
      # ----------------------------------------------------

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb

          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      # ----------------------------------------------------
      # Install Dart Sass
      # ----------------------------------------------------

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      # ----------------------------------------------------
      # Checkout repository + PaperMod submodule
      # ----------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ----------------------------------------------------
      # Configure GitHub Pages
      # ----------------------------------------------------

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # ----------------------------------------------------
      # Install Node dependencies if present
      # ----------------------------------------------------

      - name: Install Node.js dependencies
        run: |
          [[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true

      # ----------------------------------------------------
      # Build Hugo site
      # ----------------------------------------------------

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # ----------------------------------------------------
      # Upload generated site
      # ----------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # ========================================================
  # Deploy
  # ========================================================

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
